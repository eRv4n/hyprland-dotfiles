input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(228, 255, 233, 0.6)
    inner_color = rgba(228, 255, 233, 0.6)
    font_color = rgb(255, 255, 255)
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false
    rounding = -1
    position = 0, -100
    halign = center
    valign = center
}

# LOCK ICON
label {
    monitor =
    text = 󰌾
    font_size = 40
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, -50
    halign = center
    valign = top
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 140
    font_family = $font

    position = 0, -110
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, -320
    halign = center
    valign = top
}

